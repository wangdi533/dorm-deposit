<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍押金管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f8f9fb; color: #1e293b; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .header { background: #fff; border-bottom: 1px solid #eef0f4; position: sticky; top: 0; z-index: 40; }
    .card { background: #fff; border-radius: 16px; border: 1px solid #eef0f4; box-shadow: 0 1px 2px rgba(0,0,0,.02); }
    .card-padded { padding: 28px; }
    .stat-card {
      background: #fff; border-radius: 14px; border: 1px solid #eef0f4;
      padding: 20px 22px; display: flex; align-items: center; gap: 14px; transition: box-shadow .2s;
    }
    .stat-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.04); }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .stat-icon svg { width: 20px; height: 20px; }
    .stat-value { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
    .stat-label { font-size: 12px; color: #94a3b8; font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
    .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
    @media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4,1fr); } }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; transition: all .15s; white-space: nowrap; letter-spacing: .01em;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(.97); }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 8px; }
    .btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 7px; gap: 5px; }
    .btn-primary { background: #3b82f6; color: #fff; box-shadow: 0 1px 2px rgba(59,130,246,.15); }
    .btn-primary:hover { background: #2563eb; box-shadow: 0 2px 8px rgba(59,130,246,.25); }
    .btn-success { background: #22c55e; color: #fff; box-shadow: 0 1px 2px rgba(34,197,94,.15); }
    .btn-success:hover { background: #16a34a; box-shadow: 0 2px 8px rgba(34,197,94,.25); }
    .btn-warning { background: #f59e0b; color: #fff; box-shadow: 0 1px 2px rgba(245,158,11,.15); }
    .btn-warning:hover { background: #d97706; box-shadow: 0 2px 8px rgba(245,158,11,.25); }
    .btn-danger { background: #ef4444; color: #fff; box-shadow: 0 1px 2px rgba(239,68,68,.15); }
    .btn-danger:hover { background: #dc2626; box-shadow: 0 2px 8px rgba(239,68,68,.25); }
    .btn-ghost { background: #fff; color: #64748b; border: 1px solid #e2e8f0; box-shadow: none; }
    .btn-ghost:hover { background: #f8fafc; border-color: #cbd5e1; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .01em; }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; }
    .pill-gray   { background: #f1f5f9; color: #64748b; } .pill-gray   .pill-dot { background: #94a3b8; }
    .pill-amber  { background: #fef3c7; color: #b45309; } .pill-amber  .pill-dot { background: #f59e0b; }
    .pill-blue   { background: #dbeafe; color: #1d4ed8; } .pill-blue   .pill-dot { background: #3b82f6; }
    .pill-green  { background: #dcfce7; color: #15803d; } .pill-green  .pill-dot { background: #22c55e; }
    .pill-orange { background: #ffedd5; color: #c2410c; } .pill-orange .pill-dot { background: #f97316; }
    .pill-violet { background: #ede9fe; color: #6d28d9; } .pill-violet .pill-dot { background: #8b5cf6; }
    .pill-cyan   { background: #cffafe; color: #0e7490; } .pill-cyan   .pill-dot { background: #06b6d4; }
    .pill-red    { background: #fee2e2; color: #b91c1c; } .pill-red    .pill-dot { background: #ef4444; }

    .role-badge { font-size: 11px; padding: 5px 12px; border-radius: 999px; font-weight: 700; letter-spacing: .02em; }
    .role-student { background: #dbeafe; color: #1d4ed8; }
    .role-dorm    { background: #ffedd5; color: #c2410c; }
    .role-finance { background: #dcfce7; color: #15803d; }
    .role-admin   { background: #fce7f3; color: #be185d; }

    .tl-wrap { display: flex; align-items: flex-start; }
    .tl-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; min-width: 0; }
    .tl-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 14px; z-index: 1; }
    .tl-dot svg { width: 16px; height: 16px; }
    .tl-dot-done   { background: #16a34a; color: #fff; }
    .tl-dot-active { background: #fff; color: #3b82f6; border: 2.5px solid #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .tl-dot-wait   { background: #f1f5f9; color: #cbd5e1; border: 2px dashed #e2e8f0; }
    .tl-label { font-size: 12px; font-weight: 600; margin-top: 8px; text-align: center; white-space: nowrap; }
    .tl-label-done   { color: #16a34a; }
    .tl-label-active { color: #1e293b; }
    .tl-label-wait   { color: #94a3b8; }
    .tl-line { flex: 1; height: 2px; margin: 19px 12px 0; border-radius: 2px; }
    .tl-line-done   { background: #86efac; }
    .tl-line-active { background: #bfdbfe; }
    .tl-line-wait   { background: #f1f5f9; }

    .filter-group { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 10px; }
    .filter-btn { padding: 7px 15px; border-radius: 8px; font-size: 12.5px; font-weight: 600; border: none; cursor: pointer; background: transparent; color: #64748b; transition: all .15s; }
    .filter-btn:hover { color: #334155; }
    .filter-btn.active { background: #fff; color: #3b82f6; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

    .modal-mask { background: rgba(15,23,42,.5); backdrop-filter: blur(4px); }
    .modal-box { background: #fff; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,.03), 0 20px 60px rgba(0,0,0,.1); overflow: hidden; }
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 99; pointer-events: none; }
    .toast-msg { background: #1e293b; color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,.15); }
    .empty-state { display: flex; flex-direction: column; align-items: center; padding: 60px 24px; }
    .empty-icon { width: 64px; height: 64px; border-radius: 50%; background: #f8fafc; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; border: 1px solid #eef0f4; }
    .empty-icon svg { width: 28px; height: 28px; color: #cbd5e1; }
    .list-row { transition: background .12s; }
    .list-row:hover { background: #f8fafc; }
    .section-head { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
    .section-bar { width: 3px; height: 20px; border-radius: 2px; }

    .info-card { border-radius: 14px; padding: 20px 24px; display: flex; align-items: flex-start; gap: 14px; }
    .info-card .info-icon { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.93); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn .4s ease; }
    .slide-up { animation: slideUp .35s ease; }
    .scale-in { animation: scaleIn .3s ease; }
    .animate-spin { animation: spin 1s linear infinite; }

    .sync-bar { background: #fefce8; border-bottom: 1px solid #fef08a; padding: 6px 24px; font-size: 12px; color: #a16207; text-align: center; font-weight: 600; }
    .sync-bar-err { background: #fef2f2; border-bottom: 1px solid #fecaca; color: #991b1b; }

    .user-info-card {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border-radius: 18px; padding: 28px; color: #fff; position: relative; overflow: hidden;
    }
    .user-info-card::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.03);
    }
    .user-avatar {
      width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; border: 1px solid rgba(255,255,255,.08);
    }

    .login-card {
      background: #fff; border-radius: 24px; border: 1px solid #eef0f4;
      box-shadow: 0 1px 3px rgba(0,0,0,.02), 0 20px 60px rgba(0,0,0,.06);
    }
    .phone-input {
      font-size: 24px; font-weight: 700; letter-spacing: .04em;
      text-align: center; border: 2px solid #e2e8f0; border-radius: 16px;
      padding: 16px; width: 100%; transition: border-color .2s;
    }
    .phone-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 4px rgba(59,130,246,.08); }
    .phone-input::placeholder { font-size: 16px; font-weight: 400; letter-spacing: 0; color: #cbd5e1; }

    .admin-tab {
      padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; background: transparent; color: #64748b;
      transition: all .15s;
    }
    .admin-tab:hover { background: #f8fafc; color: #334155; }
    .admin-tab.active { background: #3b82f6; color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,.2); }

    input:focus, textarea:focus, select:focus { outline: none; }
    .border-3 { border-width: 3px; }
  </style>
</head>
<body>
<div id="syncBar" class="sync-bar" style="display:none"></div>
<div id="app"></div>

<!-- Image Modal -->
<div id="imgModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-mask p-5" onclick="closeImgModal()">
  <div class="max-w-3xl w-full modal-box scale-in" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h3 class="font-bold text-gray-800" id="imgModalTitle">截图预览</h3>
      <button onclick="closeImgModal()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 text-lg">&#10005;</button>
    </div>
    <div class="p-6 max-h-[70vh] overflow-auto flex items-center justify-center bg-gray-50/50">
      <img id="imgModalSrc" src="" alt="截图" class="max-w-full max-h-[60vh] rounded-xl" />
    </div>
  </div>
</div>

<!-- Action Modal -->
<div id="actionModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-mask p-5">
  <div class="max-w-lg w-full modal-box scale-in">
    <div class="px-7 pt-7 pb-3">
      <h3 id="actionModalTitle" class="text-xl font-bold text-gray-800"></h3>
      <p id="actionModalDesc" class="text-sm text-gray-500 mt-2"></p>
      <div id="actionModalBody" class="mt-5"></div>
    </div>
    <div class="flex gap-3 px-7 py-5 bg-gray-50/70 border-t border-gray-100">
      <button id="actionModalCancel" class="btn btn-ghost flex-1 justify-center">取消</button>
      <button id="actionModalConfirm" class="btn btn-primary flex-1 justify-center">确认</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none;">
  <div class="toast-msg" id="toastMsg"></div>
</div>

<!-- Registration Modal -->
<div id="regModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-mask p-5">
  <div class="max-w-md w-full modal-box scale-in">
    <div class="px-7 pt-7 pb-3">
      <h3 class="text-xl font-bold text-gray-800">登记新住户</h3>
      <p class="text-sm text-gray-500 mt-1">添加新入住学生信息</p>
      <div style="margin-top:20px">
        <div style="margin-bottom:16px"><label class="text-sm font-bold text-gray-600 block mb-2">姓名 <span class="text-red-400">*</span></label><input id="regName" type="text" placeholder="请输入学生姓名" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" /></div>
        <div style="margin-bottom:16px"><label class="text-sm font-bold text-gray-600 block mb-2">房间号 <span class="text-red-400">*</span></label><input id="regRoom" type="text" placeholder="例如：A栋-303" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" /></div>
        <div><label class="text-sm font-bold text-gray-600 block mb-2">手机号</label><input id="regPhone" type="text" placeholder="请输入手机号" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" /></div>
      </div>
    </div>
    <div class="flex gap-3 px-7 py-5 bg-gray-50/70 border-t border-gray-100">
      <button onclick="closeRegModal()" class="btn btn-ghost flex-1 justify-center">取消</button>
      <button onclick="quickRegister()" class="btn btn-primary flex-1 justify-center">添加住户</button>
    </div>
  </div>
</div>

<script>
// ===================== Data Layer (Cloud Sync) =====================
const STORAGE_KEY = 'dorm_deposit_records';
const LOGIN_KEY = 'dorm_login_phone';
const DEPOSIT_AMOUNT = 500;
const ADMIN_PHONE = '10000000001';

// GitHub Sync
var GH_OWNER = 'wangdi533';
var GH_REPO = 'dorm-deposit';
var GH_BRANCH = 'main';
var GH_DATA_URL = 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/data.json';
var GH_API_URL = 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/data.json';
var TOKEN_KEY = 'dorm_gh_token';
var GH_TOKEN = localStorage.getItem(TOKEN_KEY) || '';

var records = [];
var loginPhone = localStorage.getItem(LOGIN_KEY) || '';
var syncError = false;

function utf8ToBase64(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin);
}

async function loadRecords() {
  try {
    var resp = await fetch(GH_DATA_URL + '?t=' + Date.now());
    if (resp.ok) {
      var data = await resp.json();
      if (Array.isArray(data) && data.length > 0) {
        records = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        syncError = false;
        return;
      }
    }
  } catch(e) { console.log('GitHub fetch failed, trying localStorage'); }

  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      records = JSON.parse(saved);
      if (records.length > 0 && records[0].role === undefined) {
        records = seedData();
      }
    } catch(e) { records = seedData(); }
  } else {
    records = seedData();
  }
}

function seedData() {
  var now = Date.now();
  return [
    { id:'A001', name:'管理员01', role:'admin', room:'管理后台', phone:'10000000001', depositAmount:0, payStatus:'checked_in', screenshot:null, uploadTime:null, financeConfirmTime:null, dormConfirmTime:null, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null },
    { id:'S001', name:'张明', role:'student', room:'A栋-301', phone:'13800001234', depositAmount:DEPOSIT_AMOUNT, payStatus:'pending', screenshot:null, uploadTime:null, financeConfirmTime:null, dormConfirmTime:null, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null },
    { id:'S002', name:'李华', role:'student', room:'A栋-302', phone:'13900005678', depositAmount:DEPOSIT_AMOUNT, payStatus:'uploaded', screenshot:null, uploadTime:now-3600000, financeConfirmTime:null, dormConfirmTime:null, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null },
    { id:'S003', name:'王芳', role:'student', room:'B栋-201', phone:'13700008888', depositAmount:DEPOSIT_AMOUNT, payStatus:'checked_in', screenshot:null, uploadTime:now-172800000, financeConfirmTime:now-169200000, dormConfirmTime:now-165600000, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null },
    { id:'D001', name:'王宿管', role:'dorm', room:'管理办公室', phone:'15000000001', depositAmount:0, payStatus:'checked_in', screenshot:null, uploadTime:null, financeConfirmTime:null, dormConfirmTime:null, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null },
    { id:'F001', name:'李财务', role:'finance', room:'财务办公室', phone:'15000000002', depositAmount:0, payStatus:'checked_in', screenshot:null, uploadTime:null, financeConfirmTime:null, dormConfirmTime:null, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null },
  ];
}

async function saveRecords(showLoading) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  if (!GH_TOKEN) {
    if (showLoading) { showSyncError('未配置云端同步密钥，数据仅保存在本地'); }
    return true;
  }
  if (showLoading && document.getElementById('syncBar')) {
    document.getElementById('syncBar').className = 'sync-bar';
    document.getElementById('syncBar').innerHTML = '&#128260; 正在同步到云端...';
    document.getElementById('syncBar').style.display = 'block';
  }

  try {
    var content = JSON.stringify(records, null, 2);
    var base64 = utf8ToBase64(content);

    var sha = null;
    try {
      var getResp = await fetch(GH_API_URL, { headers: {'Authorization':'token '+GH_TOKEN} });
      if (getResp.ok) { var d = await getResp.json(); sha = d.sha; }
    } catch(e) {}

    var body = { message:'Update dorm data @'+new Date().toISOString().replace('T',' ').substring(0,19), content:base64, branch:GH_BRANCH };
    if (sha) body.sha = sha;

    var putResp = await fetch(GH_API_URL, {
      method:'PUT',
      headers: {'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });

    if (putResp.ok) {
      syncError = false;
      var sb = document.getElementById('syncBar');
      if (sb) {
        sb.className = 'sync-bar';
        sb.innerHTML = '&#9989; 数据已同步到云端';
        sb.style.display = 'block';
        clearTimeout(window._syncTid);
        window._syncTid = setTimeout(function(){ sb.style.display = 'none'; }, 2500);
      }
      return true;
    }

    if (putResp.status === 409) {
      syncError = true;
      showSyncError('同步冲突，请刷新页面后再操作');
      return false;
    } else {
      syncError = true;
      showSyncError('云端保存失败（错误码: '+putResp.status+'）');
      return false;
    }
  } catch(e) {
    syncError = true;
    showSyncError('云端连接失败，数据仅保存在本地（请检查网络后重试）');
    return false;
  }
}

function showSyncError(msg) {
  var sb = document.getElementById('syncBar');
  if (sb) {
    sb.className = 'sync-bar sync-bar-err';
    sb.innerHTML = '&#9888;&#65039; '+msg+' <button onclick="retrySync()" style="text-decoration:underline;cursor:pointer;font-weight:700;margin-left:8px;border:none;background:none;color:#991b1b;font-size:12px">点击重试</button>';
    sb.style.display = 'block';
  }
}

async function retrySync() {
  var sb = document.getElementById('syncBar');
  if (sb) { sb.style.display = 'none'; }
  var ok = await saveRecords(true);
  if (ok) { showToast('云端同步成功'); } else { showToast('同步失败，请检查网络','error'); }
}

// ===================== Helpers =====================
var PAY_STATUS = {
  pending:            { label:'待缴费',     cls:'pill-gray' },
  uploaded:           { label:'已上传截图', cls:'pill-amber' },
  finance_confirmed:  { label:'财务已确认', cls:'pill-blue' },
  checked_in:         { label:'已入住',     cls:'pill-green' },
};
var REFUND_STATUS = {
  none:           { label:'',             cls:'' },
  requested:      { label:'退宿申请中',   cls:'pill-orange' },
  dorm_approved:  { label:'宿管已通过',   cls:'pill-violet' },
  refunded:       { label:'待确认收款',   cls:'pill-cyan' },
  confirmed:      { label:'已确认收款',   cls:'pill-green' },
  rejected:       { label:'退宿被拒',     cls:'pill-red' },
};
var ROLE_LABELS = { student:'缴费用户', dorm:'宿管', finance:'财务', admin:'管理员' };
var ROLE_BADGE_CLASS = { student:'role-student', dorm:'role-dorm', finance:'role-finance', admin:'role-admin' };

function fmtTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function doLogin() {
  var phone = document.getElementById('phoneInput').value.replace(/\s/g,'').trim();
  if (!phone || phone.length < 10) { showToast('请输入有效的手机号码','error'); return; }
  loginPhone = phone;
  var user = getRecordByPhone(phone);
  if (user) {
    localStorage.setItem(LOGIN_KEY, phone);
    render();
  } else {
    loginStep = 'register';
    renderLogin();
  }
}

async function doRegister() {
  var name = document.getElementById('loginRegName').value.trim();
  var room = document.getElementById('loginRegRoom').value.trim();
  if (!name) { showToast('请输入姓名','error'); return; }
  if (!room) { showToast('请输入房间号','error'); return; }
  if (getRecordByPhone(loginPhone)) { showToast('该手机号已注册','error'); return; }
  var students = getStudents();
  var maxId = students.reduce(function(max,s){ var n=parseInt(s.id.substring(1)); return n>max?n:max; },0);
  var id = 'S'+String(maxId+1).padStart(3,'0');
  var s = { id:id, name:name, role:'student', room:room, phone:loginPhone, depositAmount:DEPOSIT_AMOUNT, payStatus:'pending', screenshot:null, uploadTime:null, financeConfirmTime:null, dormConfirmTime:null, refundStatus:'none', refundRequestTime:null, dormApproveTime:null, dormNote:'', refundTime:null, refundScreenshot:null, financeRefundNote:'', studentConfirmTime:null };
  records.push(s);
  localStorage.setItem(LOGIN_KEY, loginPhone);
  var ok = await saveRecords(true);
  if (ok) { showToast('注册成功！欢迎 '+name+' &middot; 数据已云端同步'); }
  else { showToast('注册成功（本地），云端同步失败请重试','error'); }
  render();
}

function doLogout() {
  localStorage.removeItem(LOGIN_KEY);
  loginPhone = ''; loginStep = 'input';
  renderLogin();
}

function saveToken() {
  var token = document.getElementById('tokenInput').value.trim();
  if (!token) { showToast('请输入 Token','error'); return; }
  localStorage.setItem(TOKEN_KEY, token);
  GH_TOKEN = token;
  showToast('密钥已保存，云端同步已启用');
  renderLogin();
}

function deleteStudent(id) {
  var r = records.find(function(x){return x.id===id;});
  if (!r) return;
  showActionModal({
    title:'删除学生',
    desc:'此操作将永久删除 '+r.name+'（'+r.room+'）的所有记录，不可撤销。',
    body:'<div class="bg-red-50 rounded-xl p-4 text-[13px] text-red-700"><b>&#9888;&#65039; 警告：</b>删除后所有缴费记录、退宿记录将被清除。请确认该学生已完成退宿且款项已结清。</div>',
    confirmText:'确认删除', confirmClass:'btn-danger',
    onConfirm:async function(){
      records = records.filter(function(x){return x.id!==id;});
      var ok = await saveRecords(true);
      showToast(ok ? r.name+' 已删除' : '已删除（本地），云端同步失败');
      closeModal(); render();
    }
  });
}

// ===================== Actions =====================
function handleUpload(e) {
  var f = e.target.files[0]; if (!f) return;
  if (f.size>5*1024*1024) { showToast('图片不能超过5MB','error'); return; }
  var rdr = new FileReader();
  rdr.onload = async function(ev) {
    var rec = getRecordByPhone(loginPhone);
    rec.screenshot = ev.target.result;
    rec.payStatus = 'uploaded';
    rec.uploadTime = Date.now();
    var ok = await saveRecords(true);
    showToast(ok ? '缴费截图上传成功！已同步到云端' : '上传成功���本地），云端同步失败');
    render();
  };
  rdr.readAsDataURL(f);
}

function requestRefund(id) {
  showActionModal({
    title:'申请退宿',
    desc:'提交后宿管将检查宿舍情况，确认无损坏后由财务退还押金。',
    body:'<div class="bg-amber-50 rounded-xl p-4 text-[13px] text-amber-700"><b>温馨提示：</b>请确保已搬离宿舍所有个人物品。</div>',
    confirmText:'提交退宿申请', confirmClass:'btn-warning',
    onConfirm:async function(){
      var r = records.find(function(x){return x.id===id;});
      r.refundStatus = 'requested'; r.refundRequestTime = Date.now();
      r.dormNote = ''; r.dormApproveTime = null;
      var ok = await saveRecords(true);
      showToast(ok ? '退宿申请已提交，等待宿管检查' : '申请已提交（本地），云端同步失败');
      closeModal(); render();

function financeProcessRefund(id) {
  var r = records.find(function(x){return x.id===id;});
  var fi='refundScreenshot_'+id;

        '<input type="file" id="'+fi+'" accept="image/*" class="hidden" onchange="previewRefundScreenshot(event,\''+id+'\')" />'+

      '<label class="text-sm font-bold text-gray-600 block mb-2">退款备注</label><input id="financeRefundNote_'+id+'" type="text" placeholder="例：已原路退回" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-200 focus:border-emerald-400 transition" />',
    confirmText:'确认退款', confirmClass:'btn-success',
    onConfirm:async function(){
      if(!window['_rs_'+id]){showToast('请先上传退款凭证','error');return;}
      r.refundStatus='refunded'; r.refundTime=Date.now();
      r.refundScreenshot=window['_rs_'+id];
      var ne=document.getElementById('financeRefundNote_'+id);
      r.financeRefundNote=ne?ne.value:'';
      delete window['_rs_'+id];
      var ok = await saveRecords(true);
      showToast(ok ? r.name+' 退款处理成功' : '退款处理成功（本地），云端同步失败');
      closeModal(); render();
    }
  });
}

function previewRefundScreenshot(e,id) {
  var f=e.target.files[0]; if(!f)return;
  if(f.size>5*1024*1024){showToast('图片不能超过5MB','error');return;}
  var rdr2=new FileReader();
  rdr2.onload=function(ev){
    window['_rs_'+id]=ev.target.result;
    var pd=document.getElementById('refundPreview_'+id);
    var pi=document.getElementById('refundPreviewImg_'+id);
    if(pd&&pi){pi.src=ev.target.result;pd.classList.remove('hidden');}
  };
  rdr2.readAsDataURL(f);
}

// ===================== Modal Helpers =====================
function showActionModal(opt) {
  document.getElementById('actionModalTitle').textContent=opt.title;
  document.getElementById('actionModalDesc').textContent=opt.desc;
  document.getElementById('actionModalBody').innerHTML=opt.body;
  var cn=document.getElementById('actionModalConfirm');
  cn.textContent=opt.confirmText||'确认';
  cn.className='btn '+(opt.confirmClass||'btn-primary')+' flex-1 justify-center';
  cn.onclick=opt.onConfirm;
  document.getElementById('actionModalCancel').onclick=closeModal;
  var foot=cn.parentElement;
  var ex=document.getElementById('rejectBtn'); if(ex)ex.remove();
  if(opt.extraBtn){foot.insertAdjacentHTML('afterbegin',opt.extraBtn);document.getElementById('rejectBtn').onclick=opt.onExtra;}
  var m=document.getElementById('actionModal');m.classList.remove('hidden');m.classList.add('flex');
}
function closeModal(){var m=document.getElementById('actionModal');m.classList.add('hidden');m.classList.remove('flex');}
function openImgModal(src,title){
  document.getElementById('imgModalTitle').textContent=title||'图片预览';
  document.getElementById('imgModalSrc').src=src;
  var m=document.getElementById('imgModal');m.classList.remove('hidden');m.classList.add('flex');
}
function closeImgModal(){var m=document.getElementById('imgModal');m.classList.add('hidden');m.classList.remove('flex');}
document.getElementById('actionModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ===================== Registration =====================
function nextStudentId(){
  var students=getStudents();
  var maxId=students.reduce(function(max,s){var n=parseInt(s.id.substring(1));return n>max?n:max;},0);
  return 'S'+String(maxId+1).padStart(3,'0');
}
function openRegModal(){var m=document.getElementById('regModal');m.classList.remove('hidden');m.classList.add('flex');}
function closeRegModal(){var m=document.getElementById('regModal');m.classList.add('hidden');m.classList.remove('flex');}
document.getElementById('regModal').addEventListener('click',function(e){if(e.target===this)closeRegModal();});

async function quickRegister(){
  var name=document.getElementById('regName').value.trim();
  var room=document.getElementById('regRoom').value.trim();
  var phone=document.getElementById('regPhone').value.trim()||'';
  if(!name){showToast('请输入学生姓名','error');return;}
  if(!room){showToast('请输入房间号','error');return;}
  var ok = await addNewStudent({name:name,room:room,phone:phone});
  showToast(ok ? '登记成功：'+name : '登记成功（本地），云端同步失败 &middot; 点击顶部重试');
  closeRegModal();render();
}

async function addNewStudent(data){
  var id=nextStudentId();
  var s={id:id,name:data.name,role:'student',room:data.room,phone:data.phone||'',depositAmount:DEPOSIT_AMOUNT,payStatus:'pending',screenshot:null,uploadTime:null,financeConfirmTime:null,dormConfirmTime:null,refundStatus:'none',refundRequestTime:null,dormApproveTime:null,dormNote:'',refundTime:null,refundScreenshot:null,financeRefundNote:'',studentConfirmTime:null};
  records.push(s);
  var ok = await saveRecords(true);
  return ok;
}

  loadRecords().then(function() {
    if (loginPhone && getRecordByPhone(loginPhone)) {
      render();
    } else {
      renderLogin();
    }
  });
})();
